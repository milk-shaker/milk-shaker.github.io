  <!--======================================================================
       COMING-SOON LANDING

       One screen while the product photography is being shot. Logo,
       tagline, one CTA to the waitlist form, one line of contact in the
       footer. No header, no menu, no site nav: nothing here links to the
       dormant pages. The full waitlist landing is parked, unlinked, at
       /waitlist-landing.html; restore it by moving that file back here.

       It loads /style.css only for the shared type and colour: Quicksand,
       the plum ink and the periwinkle button are all the site's own, so
       this page reads as part of it. Everything structural is the small
       sheet below. ref.js is kept so a referral code on the root URL
       survives the click through to the form.

       THE BACKGROUND. A blush / cream / periwinkle gradient that sits
       very faintly restless on its own, and calms wherever the pointer
       goes: a soft cream wash follows the cursor, easing in slowly, as
       if the pressure were being worked out of that spot. Pointer only,
       and it eases toward centre when the pointer leaves; with a coarse
       pointer or reduced-motion preference it holds a gentle static
       glow instead.
  =======================================================================-->
  <link rel="stylesheet" href="/style.css" />

  <style>
    :root {
      /* pointer position, eased by the rAF loop; starts centred */
      --mx: 50%;
      --my: 42%;
    }

    body.lp {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* base wash: blush, then soft periwinkle, then cream */
      background:
        linear-gradient(160deg, #F8E4E7 0%, #EDE6F4 44%, #E7E8F7 70%, #FBF7F0 100%)
        fixed;
      overflow-x: hidden;
    }

    /*  The moving ground. Two oversized layers of soft blooms that turn
        slowly in opposite directions, so the blush and periwinkle drift
        past each other and the colour under any given point is always
        changing. Purely decorative, behind everything, and held still
        for anyone who asks for reduced motion. */
    .cs-field,
    .cs-field-b {
      position: fixed;
      inset: -30vmax;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
    }

    .cs-field {
      background:
        radial-gradient(34vmax 34vmax at 26% 30%, rgba(236, 133, 172, 0.72), rgba(236, 133, 172, 0) 60%),
        radial-gradient(38vmax 38vmax at 76% 82%, rgba(224, 118, 132, 0.56), rgba(224, 118, 132, 0) 60%);
      animation: cs-turn 42s linear infinite;
    }

    .cs-field-b {
      background:
        radial-gradient(36vmax 36vmax at 80% 24%, rgba(134, 132, 216, 0.68), rgba(134, 132, 216, 0) 62%),
        radial-gradient(34vmax 34vmax at 18% 76%, rgba(156, 155, 214, 0.54), rgba(156, 155, 214, 0) 62%);
      animation: cs-turn-reverse 56s linear infinite;
    }

    /*  Rotation plus a translated wander, so the blooms sweep across the
        middle of the screen too and not just pivot around dead centre. */
    @keyframes cs-turn {
      0%   { transform: rotate(0deg)   translate3d(-4%, -3%, 0) scale(1.08); }
      50%  { transform: rotate(180deg) translate3d(4%, 3%, 0)   scale(1.18); }
      100% { transform: rotate(360deg) translate3d(-4%, -3%, 0) scale(1.08); }
    }

    @keyframes cs-turn-reverse {
      0%   { transform: rotate(360deg) translate3d(3%, -4%, 0)  scale(1.16); }
      50%  { transform: rotate(180deg) translate3d(-3%, 4%, 0)  scale(1.05); }
      100% { transform: rotate(0deg)   translate3d(3%, -4%, 0)  scale(1.16); }
    }

    /*  The relief. A large, soft cream wash centred on the pointer that
        sits over the restless layer and quiets it locally. The custom
        properties are moved by script; the transition is a short safety
        net, the rAF loop does the real smoothing. */
    .cs-relief {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        34vmax 34vmax at var(--mx) var(--my),
        rgba(252, 248, 242, 0.88) 0%,
        rgba(252, 248, 242, 0.62) 26%,
        rgba(252, 248, 242, 0.28) 46%,
        rgba(252, 248, 242, 0.08) 62%,
        rgba(252, 248, 242, 0) 76%
      );
      transition: background 220ms ease-out;
    }
    /*  A brighter, tighter core: the spot that has just been worked
        loose sits calmest of all. */
    .cs-relief::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        13vmax 13vmax at var(--mx) var(--my),
        rgba(255, 253, 249, 0.5) 0%,
        rgba(255, 253, 249, 0) 70%
      );
    }

    .cs-main {
      position: relative;
      z-index: 2;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 32px;
    }

    .cs-logo {
      width: min(320px, 74vw);
      height: auto;
      display: block;
      margin-bottom: 10px;
    }

    .cs-tag {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      margin-bottom: 38px;
    }

    /*  The phrase above: kept to a single line, sized down so it does
        not compete with the line under it. */
    .cs-tag-lead {
      margin: 0;
      white-space: nowrap;
      color: var(--ms-ink-soft);
      font-size: clamp(0.85rem, 0.62rem + 1.5vw, 1.15rem);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /*  The line below: its own line, and the biggest thing on the page
        after the wordmark. Inherits the site's serif heading face. */
    .cs-tag-main {
      margin: 0;
      max-width: 16ch;
      color: var(--ms-plum);
      font-size: clamp(1.95rem, 1.3rem + 3.4vw, 3rem);
      line-height: 1.16;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    .cs-main .lp-btn {
      margin-top: 0;
    }

    .cs-footer {
      position: relative;
      z-index: 2;
      flex: none;
      padding: 20px 24px 32px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--ms-ink-soft);
    }

    .cs-footer a {
      color: var(--ms-plum);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(97, 47, 72, 0.3);
    }

    .cs-footer a:hover { border-bottom-color: rgba(97, 47, 72, 0.7); }

    @media (prefers-reduced-motion: reduce) {
      .cs-field,
      .cs-field-b { animation: none; }
      .cs-relief { transition: none; }
    }
  </style>

  <!--  Blocking, and in the head, on purpose: it has to store or restore

  <script>
    (function () {
      'use strict';
      var relief = document.getElementById('csRelief');
      if (!relief) return;

      var fine = window.matchMedia('(pointer: fine)').matches;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /*  Coarse pointer or reduced-motion: leave the wash sitting where
          the CSS parked it, a soft static glow near the top. */
      if (!fine || still) return;

      var vw = window.innerWidth, vh = window.innerHeight;
      window.addEventListener('resize', function () {
        vw = window.innerWidth; vh = window.innerHeight;
      }, { passive: true });

      /*  Target is where the pointer is; current eases toward it. The
          low factor is the point of the whole thing: relief arrives
          slowly, it does not snap. */
      var tx = vw * 0.5, ty = vh * 0.42;
      var cx = tx, cy = ty;
      var raf = null;

      function loop() {
        cx += (tx - cx) * 0.055;
        cy += (ty - cy) * 0.055;
        relief.style.setProperty('--mx', cx.toFixed(1) + 'px');
        relief.style.setProperty('--my', cy.toFixed(1) + 'px');

        if (Math.abs(tx - cx) > 0.4 || Math.abs(ty - cy) > 0.4) {
          raf = requestAnimationFrame(loop);
        } else {
          raf = null;
        }
      }

      function nudge() {
        if (raf == null) raf = requestAnimationFrame(loop);
      }

      window.addEventListener('pointermove', function (e) {
        tx = e.clientX;
        ty = e.clientY;
        nudge();
      }, { passive: true });

      /*  Pointer gone: drift the calm back to the resting spot rather
          than freezing mid-screen. */
      window.addEventListener('pointerleave', function () {
        tx = vw * 0.5;
        ty = vh * 0.42;
        nudge();
      });
    })();
  </script>

</body>
