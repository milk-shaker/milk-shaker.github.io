  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/droplet-16.png?v=3" />

  <!--======================================================================
       COMING-SOON LANDING — two panels.

       PANEL 1, full height. Wordmark and the headline on the left, over
       the moving gradient; the lifestyle shot and the one CTA on the
       right. Nothing links to the dormant pages: the CTA goes to
       /coming-soon-early-access.html and the footer carries the email.
       The full waitlist landing is parked, unlinked, at
       /waitlist-landing.html; restore it by moving that file back here.

       PANEL 2, the zoom. Same mechanic as the reference build
       (tayanecklace.com): a runway taller than the viewport, a sticky
       pin inside it at exactly viewport height, and a card inside that
       which scales from 0.58 to 1 and loses its corner radius as you
       scroll through the runway, so the product panel appears to zoom
       up into the full screen. Driven from one scroll listener into two
       custom properties; with reduced motion it is simply already open.

       Panel 1 is a full-bleed muted loop, /assets/video/momandbaby.mp4,
       with the copy over a scrim. Nothing is a placeholder any more.

       Panel 2 is the real product photograph, held still. It used to
       rock on a shallow rotateY like a turntable; that is gone by
       request. A true 360 spin would need an actual 3D model anyway --
       with a flat photograph, anything past about twenty degrees stops
       reading as rotation and starts reading as skew.

       It loads /style.css for the shared type and colour: Quicksand, the
       serif display face, the plum ink and the periwinkle button are the
       site's own, so this page reads as part of it. ref.js is kept so a
       referral code on the root URL survives the click to the form.
  =======================================================================-->
  <link rel="stylesheet" href="/style.css" />

  <style>
    :root {
      /* pointer position for the relief wash, eased by the rAF loop */
      --mx: 50%;
      --my: 42%;
      /* zoom progress for panel 2, written by the scroll listener */
      --z: 0.58;
      --zr: 30px;
      --zo: 0;
    }

    body.lp {
      background:
        linear-gradient(160deg, #F8E4E7 0%, #EDE6F4 44%, #E7E8F7 70%, #FBF7F0 100%)
        fixed;
      /*  clip, not hidden: `overflow-x: hidden` would turn the body into
          a scroll container and break the sticky pin in panel 2. */
      overflow-x: clip;
    }

    /*  ---------------------------------------------------------------
        THE MOVING GROUND
        Two oversized layers of soft blooms that turn slowly in opposite
        directions, so the blush and periwinkle drift past each other and
        the colour under any given point is always changing. Fixed, so
        they carry through both panels. Held still for reduced motion.
        --------------------------------------------------------------- */
    .cs-field,
    .cs-field-b {
      position: fixed;
      inset: -30vmax;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
    }

    .cs-field {
      background:
        radial-gradient(34vmax 34vmax at 26% 30%, rgba(236, 133, 172, 0.72), rgba(236, 133, 172, 0) 60%),
        radial-gradient(38vmax 38vmax at 76% 82%, rgba(224, 118, 132, 0.56), rgba(224, 118, 132, 0) 60%);
      animation: cs-turn 42s linear infinite;
    }

    .cs-field-b {
      background:
        radial-gradient(36vmax 36vmax at 80% 24%, rgba(134, 132, 216, 0.68), rgba(134, 132, 216, 0) 62%),
        radial-gradient(34vmax 34vmax at 18% 76%, rgba(156, 155, 214, 0.54), rgba(156, 155, 214, 0) 62%);
      animation: cs-turn-reverse 56s linear infinite;
    }

    @keyframes cs-turn {
      0%   { transform: rotate(0deg)   translate3d(-4%, -3%, 0) scale(1.08); }
      50%  { transform: rotate(180deg) translate3d(4%, 3%, 0)   scale(1.18); }
      100% { transform: rotate(360deg) translate3d(-4%, -3%, 0) scale(1.08); }
    }

    @keyframes cs-turn-reverse {
      0%   { transform: rotate(360deg) translate3d(3%, -4%, 0)  scale(1.16); }
      50%  { transform: rotate(180deg) translate3d(-3%, 4%, 0)  scale(1.05); }
      100% { transform: rotate(0deg)   translate3d(3%, -4%, 0)  scale(1.16); }
    }

    /*  The relief wash: a soft cream pool that follows the pointer and
        quiets the ground locally, as if the pressure were being worked
        out of that spot. */
    .cs-relief {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        34vmax 34vmax at var(--mx) var(--my),
        rgba(252, 248, 242, 0.88) 0%,
        rgba(252, 248, 242, 0.62) 26%,
        rgba(252, 248, 242, 0.28) 46%,
        rgba(252, 248, 242, 0.08) 62%,
        rgba(252, 248, 242, 0) 76%
      );
      transition: background 220ms ease-out;
    }

    .cs-relief::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        13vmax 13vmax at var(--mx) var(--my),
        rgba(255, 253, 249, 0.5) 0%,
        rgba(255, 253, 249, 0) 70%
      );
    }

    /*  ---------------------------------------------------------------
        PANEL 1
        --------------------------------------------------------------- */
    .p1 {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: grid;
      align-items: center;
      overflow: clip;
    }

    /*  Full-bleed, behind everything in the panel. Decorative, muted and
        looping, so it carries no meaning and needs no controls. If the
        file is missing it simply paints nothing and the moving gradient
        behind the panel shows through, which is a perfectly good hero on
        its own -- there is no broken state to design around. */
    .p1-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /*  No background: a 404 should fall through to the gradient. */
      background: transparent;
      pointer-events: none;
    }

    /*  Footage is unknown and can be light or dark under the copy, so the
        scrim is heavy where the text sits and clears toward the other
        side. Plum on this is comfortably above 7:1 whatever is behind. */
    .p1-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        100deg,
        rgba(251, 247, 240, 0.94) 0%,
        rgba(251, 247, 240, 0.86) 30%,
        rgba(251, 247, 240, 0.44) 58%,
        rgba(251, 247, 240, 0.16) 100%
      );
    }

    .p1-copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(32px, 5vh, 64px) clamp(24px, 5vw, 72px);
    }

    .p1-logo {
      width: min(340px, 68%);
      max-width: 340px;
      height: auto;
      display: block;
      margin-bottom: clamp(30px, 5.5vh, 60px);
    }

    .p1-line {
      margin: 0 0 clamp(28px, 4.5vh, 48px);
      max-width: 13ch;
      color: var(--ms-plum);
      /*  Inherits the site's serif display face from style.css, which
          also forces weight 400 on every h1. */
      font-size: clamp(2.2rem, 1.2rem + 4.2vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    /*  A quiet cue that there is a second panel. */
    .p1-scroll {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: clamp(26px, 4vh, 44px) 0 0;
      color: var(--ms-ink-soft);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .p1-scroll svg {
      width: 15px;
      height: 15px;
      animation: p1-bob 2.4s ease-in-out infinite;
    }

    @keyframes p1-bob {
      0%, 100% { transform: translateY(-2px); }
      50%      { transform: translateY(3px); }
    }

    /*  ---------------------------------------------------------------
        PANEL 2 — the zoom runway
        --------------------------------------------------------------- */
    .p2 {
      position: relative;
      z-index: 2;
      /*  Runway. The extra 130vh over the pin is the scroll distance the
          zoom is spread across. */
      height: 230vh;
    }

    .p2-pin {
      position: sticky;
      top: 0;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: clip;
    }

    .p2-card {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: clamp(4px, 0.8vh, 10px);
      padding: clamp(10px, 1.6vh, 22px) clamp(20px, 4vw, 56px);
      border-radius: var(--zr);
      background:
        radial-gradient(122% 100% at 50% 24%, #F3EDFC 0%, #E1DAF5 44%, #C7BFE6 100%);
      box-shadow: 0 40px 90px -40px rgba(81, 79, 154, 0.5);
      transform: scale(var(--z));
      transform-origin: center center;
      will-change: transform;
    }

    /*  ---------------------------------------------------------------
        THE PRODUCT STAGE
        --------------------------------------------------------------- */
    /*  Width-driven, never height-capped: the hotspot buttons and the
        window masks below are positioned as percentages of this box, so the
        photograph has to fill it exactly. Capping height instead would
        letterbox it and slide the cups out from under their buttons. The
        vh term keeps it inside a short viewport (the shot is 1400x1225
        cut out of the studio photo, so height is 0.875x width). */
    .stage {
      position: relative;
      width: min(100%, 820px, 72vh);
      display: grid;
      place-items: center;
    }

    .shot {
      position: relative;
      width: 100%;
    }

    .shot-base {
      display: block;
      width: 100%;
      height: auto;
    }

    /*  The window. A pale wash masked to a feathered ellipse over one cup
        apex, sitting between the photograph and the module. Fading it in
        is what makes the fabric read as going sheer -- fading a second
        copy of the photo does nothing, because the fabric underneath it
        is identical. The two mask centres are the cup apexes measured off
        the trimmed shot; retune them if it is ever reshot. */
    .win {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background: rgba(249, 246, 255, 0.74);
      transition: opacity 460ms ease;
    }

    .win--l {
      -webkit-mask-image: radial-gradient(ellipse 17% 18% at 25% 66%, #000 44%, rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse 17% 18% at 25% 66%, #000 44%, rgba(0, 0, 0, 0) 100%);
    }

    .win--r {
      -webkit-mask-image: radial-gradient(ellipse 17% 18% at 75% 66%, #000 44%, rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse 17% 18% at 75% 66%, #000 44%, rgba(0, 0, 0, 0) 100%);
    }

    /*  The straps get a periwinkle highlight rather than the cups' pale
        wash. Nothing is hidden inside a strap, so fading it toward white
        just blanks it out; tinting reads as "this bit", which is what a
        strap callout means. */
    .win--sl,
    .win--sr { background: rgba(146, 144, 214, 0.38); }

    .win--sl {
      -webkit-mask-image: radial-gradient(ellipse 8.5% 25% at 20% 19%, #000 42%, rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse 8.5% 25% at 20% 19%, #000 42%, rgba(0, 0, 0, 0) 100%);
    }

    .win--sr {
      -webkit-mask-image: radial-gradient(ellipse 8.5% 25% at 80% 19%, #000 42%, rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse 8.5% 25% at 80% 19%, #000 42%, rgba(0, 0, 0, 0) 100%);
    }

    /*  Square art, so its height as a share of the box is width x
        (1400/1225) = 1.143x. Centred on the same points as the windows. */
    .mod {
      position: absolute;
      width: 33%;
      height: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 460ms ease;
      overflow: visible;
    }

    .mod--l { left: 8.5%; top: 47.1%; }
    .mod--r { left: 58.5%; top: 47.1%; }

    .stage.is-l .win--l,
    .stage.is-r .win--r,
    .stage.is-sl .win--sl,
    .stage.is-sr .win--sr { opacity: 1; }

    .stage.is-l .mod--l,
    .stage.is-r .mod--r { opacity: 1; }

    .pulse-a { animation: pulse-ring 3s ease-out infinite; transform-origin: center; }
    .pulse-b { animation: pulse-ring 3s ease-out infinite 1s; transform-origin: center; }

    @keyframes pulse-ring {
      0%   { opacity: 0.7; transform: scale(0.72); }
      100% { opacity: 0;   transform: scale(1.25); }
    }

    /*  Percentages of .stage, which is exactly the photograph, so these
        sit over the cup centres at 25% / 75% across and 66% down — the
        same centres the window masks use. */
    .hot {
      position: absolute;
      top: 51%;
      width: 28%;
      height: 30%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hot--l { left: 11%; }
    .hot--r { right: 11%; }

    /*  The straps run x 14-26% / 74-86% from the top down to about 42%. */
    .hot--sl,
    .hot--sr {
      top: 0;
      width: 16%;
      height: 44%;
      border-radius: 40% / 18%;
    }

    .hot--sl { left: 12%; }
    .hot--sr { right: 12%; }

    .hot:focus-visible {
      outline: 3px solid var(--ms-peri-deep);
      outline-offset: 4px;
    }

    /*  The callout. Sits under the product rather than beside it, so it
        never collides with the turning model or runs off a narrow
        screen. One box, its text swapped by script. */
    /*  Absolute inside .p2-slot, so opening it moves nothing. It used to
        float upward above the line, which put it over the band on a short
        viewport; now it opens downward into a slot of its own below the
        product and cannot reach the bra at all. */
    .callout {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(56ch, 94%);
      margin: 0;
      padding: 14px 22px;
      border-radius: 18px;
      /*  A backdrop, because on a short viewport the longest copy is
          taller than the gap under the product and will sit over the
          band. With this it reads as an annotation card rather than as
          text spilled onto the photograph. */
      background: rgba(249, 246, 255, 0.9);
      box-shadow: 0 14px 34px -18px rgba(81, 79, 154, 0.55);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      text-align: center;
      color: var(--ms-plum);
      /*  30% up on the original 0.92-1.05rem. */
      font-size: clamp(1.2rem, 1.04rem + 0.52vw, 1.37rem);
      line-height: 1.45;
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .callout.is-on { opacity: 1; transform: translate(-50%, 0); }

    .callout strong {
      display: block;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.94rem;
      color: var(--ms-peri-dark);
      margin-bottom: 6px;
    }

    /*  A reserved slot under the product for the callout to open into.
        Held at a fixed height rather than growing, so the tile can never
        push the bra around or -- as it did on a phone -- sit on top of
        it. The height is measured from the longest copy at the current
        width by the script below; this clamp is only the no-JS floor,
        and a starting value before that measurement lands. */
    .p2-slot {
      position: relative;
      width: 100%;
      min-height: clamp(150px, 26vh, 200px);
    }

    .p2-line {
      margin: 0;
      /*  Fades up over the last stretch of the zoom rather than riding in
          at full strength from the start. */
      opacity: var(--zo);
      transition: opacity 200ms linear;
      color: var(--ms-plum);
      font-size: clamp(1.5rem, 0.9rem + 2.6vw, 2.9rem);
      line-height: 1.14;
      letter-spacing: -0.015em;
      text-align: center;
      text-wrap: balance;
    }

    /*  Between the straps, near the top of the shot. Not a hit target --
        the buttons underneath it must stay reachable. */
    .stage-hint {
      position: absolute;
      top: 1.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      margin: 0;
      max-width: 44%;
      text-align: center;
      text-wrap: balance;
      pointer-events: none;
      color: var(--ms-ink-soft);
      font-size: clamp(0.86rem, 0.74rem + 0.42vw, 1.05rem);
      line-height: 1.35;
      letter-spacing: 0.02em;
      transition: opacity 320ms ease;
    }

    /*  Gone the moment a feature is open. */
    .stage.is-l .stage-hint,
    .stage.is-r .stage-hint,
    .stage.is-sl .stage-hint,
    .stage.is-sr .stage-hint { opacity: 0; }

    /*  ---------------------------------------------------------------
        FOOTER
        --------------------------------------------------------------- */
    .cs-footer {
      position: relative;
      z-index: 2;
      padding: 26px 24px 34px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--ms-ink-soft);
    }

    .cs-footer a {
      color: var(--ms-plum);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(97, 47, 72, 0.3);
    }

    .cs-footer a:hover { border-bottom-color: rgba(97, 47, 72, 0.7); }

    /*  ---------------------------------------------------------------
        NARROW
        --------------------------------------------------------------- */
    @media (max-width: 900px) {
      .p1-copy { align-items: center; text-align: center; }
      .p1-logo { width: min(300px, 74vw); margin-inline: auto; }
      .p1-line { max-width: 16ch; }
      .p1-scroll { display: none; }
      /*  Copy is centred at this width, so an angled scrim would leave
          one edge of it unreadable. Even wash instead. */
      .p1-scrim {
        background: linear-gradient(
          180deg,
          rgba(251, 247, 240, 0.9) 0%,
          rgba(251, 247, 240, 0.82) 55%,
          rgba(251, 247, 240, 0.62) 100%
        );
      }
      .p2 { height: 200vh; }

      /*  Bigger touch targets, but scoped to the cups. Written as .hot it
          also caught .hot--sl / .hot--sr -- same specificity, later in the
          sheet -- which dragged the strap buttons down onto the cups. They
          then sat over them, being later in the DOM, and swallowed every
          tap meant for a breast. */
      .hot--l,
      .hot--r { width: 32%; height: 32%; top: 50%; }

      .hot--l { left: 9%; }
      .hot--r { right: 9%; }

      .hot--sl,
      .hot--sr { top: 0; width: 20%; height: 44%; }

      .hot--sl { left: 10%; }
      .hot--sr { right: 10%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cs-field,
      .cs-field-b,
      .pulse-a,
      .pulse-b,
      .p1-scroll svg { animation: none; }
      .cs-relief { transition: none; }
      /*  No zoom: the runway collapses and the panel is simply open. */
      .p2 { height: auto; }
      .p2-pin { position: static; height: auto; min-height: 100svh; }
      .p2-card { transform: none; border-radius: 0; }
      .p2-line { opacity: 1; }
    }
  </style>

  <!--  Blocking, and in the head, on purpose: it has to store or restore
        a referral code before the CTA can be clicked. See the file. -->
  <script src="/assets/js/ref.js"></script>
</head>

<body class="lp">

  <div class="cs-field" aria-hidden="true"></div>
  <div class="cs-field-b" aria-hidden="true"></div>
  <div class="cs-relief" id="csRelief" aria-hidden="true"></div>

  <main>

    <!--====== PANEL 1 ======-->
    <section class="p1">

      <video class="p1-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true"
        tabindex="-1">
        <source src="/assets/video/momandbaby.mp4" type="video/mp4" />
      </video>
      <div class="p1-scrim" aria-hidden="true"></div>

      <div class="p1-copy">
        <img class="p1-logo" src="/assets/images/milkshaker-wordmark.png" alt="MilkShaker" width="1380"
          height="232" />
        <h1 class="p1-line">The nursing bra that lets you do more</h1>
        <a class="lp-btn lp-btn--lg" href="/coming-soon-early-access.html">
          <span>Secure yours now</span>
          <span class="lp-arrow" aria-hidden="true"></span>
        </a>
        <p class="p1-scroll" aria-hidden="true">
          <span>Scroll</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 5v14M6 13l6 6 6-6" />
          </svg>
        </p>
      </div>

    </section>

    <!--====== PANEL 2 — zooms up into the full screen ======-->
    <section class="p2" id="p2">
      <div class="p2-pin">
        <div class="p2-card" id="p2Card">

          <p class="p2-line">On-demand breastfeeding pain relief</p>

          <div class="stage" id="stage">

            <!--  Sits in the gap between the straps, which is clear from
                  the top of the shot down to about 40%. Goes when any
                  feature is open. -->
            <p class="stage-hint" id="p2Hint">Hover around the MilkShaker bra to see features</p>

            <!--  ============ THE PRODUCT ============
                  The real product photograph, with a soft-edged window
                  over each cup.

                  How the reveal works: the photograph is drawn once and
                  is always opaque. Over each cup sits a pale wash masked
                  to a feathered ellipse, at opacity 0, and over that the
                  massaging module, also at 0. Opening a cup fades both
                  in, so the fabric goes sheer in a soft pool and the
                  module shows through it.

                  The wash is what sells it. An earlier version faded in a
                  second, masked copy of the photograph instead, which did
                  nothing at all: the fabric underneath that copy is the
                  same fabric, so there was nothing to see through to and
                  the module read as a sticker on the cup.

                  Nothing is cut out of the photograph, so a reshoot only
                  means moving the two mask centres in .win--l / .win--r
                  and the matching .mod offsets.

                  The ?v= on the src is not decoration. This file has been
                  replaced twice under the same name, and both a browser
                  and the Pages CDN will keep serving the bytes they
                  already have. Bump it whenever the file changes.
                  ====================================== -->

  </footer>

  <script>
    (function () {
      'use strict';

      var root = document.documentElement;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var fine = window.matchMedia('(pointer: fine)').matches;

      /*  A looping hero is exactly what a reduced-motion preference is
          asking about, so hold it on its first frame rather than play it.
          autoplay is left in the markup so it still runs with no JS. */
      if (still) {
        var hero = document.querySelector('.p1-video');
        if (hero) { hero.removeAttribute('autoplay'); hero.pause(); }
      }

      /*  ------------------------------------------------------------
          The relief wash. Target is where the pointer is; current eases
          toward it. The low factor is the point of the whole thing:
          relief arrives slowly, it does not snap. Coarse pointer or
          reduced motion keeps the static glow the CSS parked.
          ------------------------------------------------------------ */
      var relief = document.getElementById('csRelief');
      if (relief && fine && !still) {
        var vw = window.innerWidth, vh = window.innerHeight;
        var tx = vw * 0.5, ty = vh * 0.42;
        var cx = tx, cy = ty;
        var rraf = null;

        window.addEventListener('resize', function () {
          vw = window.innerWidth; vh = window.innerHeight;
        }, { passive: true });

        var loop = function () {
          cx += (tx - cx) * 0.055;
          cy += (ty - cy) * 0.055;
          relief.style.setProperty('--mx', cx.toFixed(1) + 'px');
          relief.style.setProperty('--my', cy.toFixed(1) + 'px');
          rraf = (Math.abs(tx - cx) > 0.4 || Math.abs(ty - cy) > 0.4)
            ? requestAnimationFrame(loop) : null;
        };
        var nudge = function () { if (rraf == null) rraf = requestAnimationFrame(loop); };

        window.addEventListener('pointermove', function (e) {
          tx = e.clientX; ty = e.clientY; nudge();
        }, { passive: true });

        window.addEventListener('pointerleave', function () {
          tx = vw * 0.5; ty = vh * 0.42; nudge();
        });
      }

      /*  ------------------------------------------------------------
          PANEL 2 ZOOM
          Progress through the runway drives one scale and one radius.
          The runway is (section height - pin height), which is exactly
          the distance the pin stays stuck for, so progress hits 1 the
          moment the pin is about to release.
          ------------------------------------------------------------ */
      var p2 = document.getElementById('p2');
      if (p2 && !still) {
        var MIN = 0.58;
        var zraf = null;

        var paint = function () {
          zraf = null;
          var box = p2.getBoundingClientRect();
          var runway = p2.offsetHeight - window.innerHeight;
          if (runway <= 0) return;

          /*  -box.top is how far into the section the scroll has come. */
          var p = (-box.top) / runway;
          p = p < 0 ? 0 : (p > 1 ? 1 : p);

          /*  Ease out, so it opens quickly and settles rather than
              arriving at full size all at once at the end. */
          var e = 1 - Math.pow(1 - p, 2.2);

          root.style.setProperty('--z', (MIN + (1 - MIN) * e).toFixed(4));
          root.style.setProperty('--zr', (30 * (1 - e)).toFixed(1) + 'px');
          /*  The line under the product comes up over the last third. */
          var o = (e - 0.45) / 0.4;
          root.style.setProperty('--zo', (o < 0 ? 0 : (o > 1 ? 1 : o)).toFixed(3));
        };

        var onScroll = function () { if (zraf == null) zraf = requestAnimationFrame(paint); };

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
        paint();
      }

      /*  ------------------------------------------------------------
          THE CUP REVEAL
          One class on the stage drives the fabric, the insert and the
          marker. Pointer opens it on enter; keyboard opens it on focus;
          touch toggles it on click, so it is not hover-only.
          ------------------------------------------------------------ */
      var stage = document.getElementById('stage');
      var callout = document.getElementById('callout');
      var hint = document.getElementById('p2Hint');

      if (stage && callout) {
        var COPY = {
          l: '<strong>Clinically-proven therapy, automated for you</strong>Gentle massaging modules within ' +
             'internal pockets rest against your breast and provide inflammation and pain relief allowing milk ' +
             'to flow more freely&mdash;while you nurse, pump, or carry on with your day.',
          r: '<strong>Portable and intentionally hands-free</strong>Wireless, rechargeable, nursing bra design ' +
             'built for mobility and your busy life. The removable modules lift out, can charge while the bra ' +
             'is in the wash, and you have another week of use.',
          sl: '<strong>Shoulder straps</strong>Adjustable for comfort and removable for convenient nursing.',
          sr: '<strong>Shoulder straps</strong>Adjustable for comfort and removable for convenient nursing.'
        };
        var pinned = null;

        var SIDES = ['l', 'r', 'sl', 'sr'];

        var show = function (side) {
          SIDES.forEach(function (s) {
            stage.classList.toggle('is-' + s, side === s);
          });
          if (side) {
            callout.innerHTML = COPY[side];
            callout.classList.add('is-on');
          } else {
            callout.classList.remove('is-on');
          }
        };

        Array.prototype.forEach.call(stage.querySelectorAll('.hot'), function (btn) {
          var side = btn.getAttribute('data-side');

          btn.addEventListener('pointerenter', function (e) {
            if (e.pointerType === 'touch') return;
            show(side);
          });
          btn.addEventListener('pointerleave', function (e) {
            if (e.pointerType === 'touch') return;
            if (!pinned) show(null);
          });
          btn.addEventListener('focus', function () { show(side); });
          btn.addEventListener('blur', function () { if (!pinned) show(null); });

          /*  Tap, or a deliberate click: hold it open until the next tap
              somewhere else. */
          btn.addEventListener('click', function () {
            pinned = (pinned === side) ? null : side;
            show(pinned);
          });
        });

        document.addEventListener('click', function (e) {
          if (pinned && !e.target.closest('.hot')) { pinned = null; show(null); }
        });

        if (hint && !fine) hint.textContent = 'Tap around the MilkShaker bra to see features';

        /*  Reserve exactly the tallest copy at this width. Hardcoding it
            per breakpoint went wrong the moment the copy changed -- at
            375px the longest one wanted 249px against the 195px the
            clamp gave it, and the tile ran off the bottom of the card.
            Measuring means it survives both a reword and any viewport.
            The callout is opacity 0, not display none, so it lays out
            and reports a real height without ever being seen. */
        var slot = stage.parentNode.querySelector('.p2-slot');

        var sizeSlot = function () {
          if (!slot) return;
          var keep = callout.innerHTML;
          var tallest = 0;
          SIDES.forEach(function (side) {
            callout.innerHTML = COPY[side];
            if (callout.offsetHeight > tallest) tallest = callout.offsetHeight;
          });
          callout.innerHTML = keep;
          if (tallest) slot.style.minHeight = tallest + 'px';
        };

        /*  After fonts, because the display face changes the line count. */
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(sizeSlot);
        } else {
          sizeSlot();
        }

        var slotTimer = null;
        window.addEventListener('resize', function () {
          clearTimeout(slotTimer);
          slotTimer = setTimeout(sizeSlot, 150);
        }, { passive: true });
      }
    })();
  </script>
