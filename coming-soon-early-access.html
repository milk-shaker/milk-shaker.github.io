<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--======================================================================
       REDIRECT — this page's contents moved to the landing page.

       The address stays alive because printed QR codes point at it, and
       because referral links shared before the move carry ?ref= on this
       URL. Both have to keep working:

         - the canonical and the refresh both aim at "/", where the
           waitlist form now lives under the same #join anchor;
         - the script carries the query string across, so ?ref= survives
           and ref.js on the landing page can store it;
         - noindex, because this is a doorway, not a page. The meta
           refresh alone would be enough for Google, which follows it and
           folds this URL into the landing page, but the tag makes it
           explicit.

       The <noscript> path and the meta refresh cover browsers that never
       run the script; they lose the ?ref= code, which is the right
       trade against not arriving at all.
  =======================================================================-->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://themilkshaker.com/" />
  <meta http-equiv="refresh" content="0; url=/#join" />

  <title>MilkShaker</title>

  <link rel="icon" href="/favicon.ico?v=3" />

  <script>
    (function () {
      /*  Keep whatever came in on the URL -- ?ref= above all -- and land
          on the waitlist. location.replace so the back button goes back
          where the person came from rather than into a redirect loop. */
      var q = window.location.search || '';
      window.location.replace('/' + q + '#join');
    })();
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F8F5FA;
      color: #612F48;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #612F48; }
  </style>
</head>

<body>
  <p>
    This page has moved to <a href="/#join">themilkshaker.com</a>.
    <noscript><br />Follow the link if your browser does not take you there.</noscript>
  </p>
</body>

</html>
