<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--======================================================================
       REDIRECT STUB -- not a real page.

       This was the waitlist signup page. The form now lives on the landing
       page itself, but this URL has already been shared, so it forwards
       there rather than 404ing.

       GitHub Pages cannot send a server-side 301, so this is client-side:
       the script moves real visitors, the meta refresh covers anyone with
       JavaScript off, and the visible link is the last resort.

       The query string is carried across on purpose. Referral links point
       at URLs like this one with ?ref=CODE on the end, and dropping it on
       the way through would lose the referrer their credit. ref.js is
       loaded first for the same reason -- it stores the code for two days
       even if the redirect itself somehow loses it. The meta refresh
       cannot carry the query; it is only the no-JS fallback.

       The og tags describe the landing page, because link previews are
       built from this URL by scrapers that never run the redirect.
  =======================================================================-->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://themilkshaker.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MilkShaker" />
  <meta property="og:url" content="https://themilkshaker.com/" />
  <meta property="og:title" content="MilkShaker | The nursing bra that lets you do more" />
  <meta property="og:description"
    content="Stop worrying about the never-ending duct blockages, inflammation, and breast pain with our therapeutic nursing bra that gives mom her hands and time back." />
  <meta property="og:image" content="https://themilkshaker.com/assets/images/og-cover.jpg?v=3" />
  <meta property="og:image:secure_url" content="https://themilkshaker.com/assets/images/og-cover.jpg?v=3" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta http-equiv="refresh" content="0; url=/#join" />

  <title>Redirecting&hellip; | MilkShaker</title>
  <link rel="icon" href="/favicon.ico?v=3" />

  <script src="/assets/js/ref.js"></script>
  <script>
    /*  replace(), not assign(), so this stub stays out of the back button
        and does not bounce the visitor straight back here. Lands on the
        form, since that is what this URL used to be. */
    window.location.replace('/' + window.location.search + '#join');
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F5FA;
      color: #612F48;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      text-align: center;
      padding: 24px;
    }

    a {
      color: #612F48;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <p>
    Taking you to MilkShaker&hellip;<br />
    <a href="/#join">Continue to themilkshaker.com</a>
  </p>
</body>

</html>
